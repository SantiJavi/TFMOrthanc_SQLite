apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: orthanc-santiago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z keycloak-db 5432; do echo waiting for keycloak-db; sleep 3; done']
      containers:
      - name: keycloak
        image: orthancteam/orthanc-keycloak:26.2.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: management
        envFrom:
        - configMapRef:
            name: orthanc-config
        - configMapRef:
            name: keycloak-config
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: orthanc-secrets
              key: KC_ADMIN_USER
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orthanc-secrets
              key: KC_ADMIN_PASSWORD
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orthanc-secrets
              key: DB_KEYCLOAK_PASSWORD
        - name: KC_HOSTNAME
          value: "$(PUBLIC_DOMAIN)/keycloak"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 5
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: orthanc-santiago
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
